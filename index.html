การจัดระเบียบร่างกาย", "note": "เริ่มต้นจากความเป็นคุณ แล้วค่อย ๆ ค้นพบแสงของตัวเอง"}, {"title": "ปี 2", "name": "กรุ๊ปแยกเอก", "english": "FIND YOUR FREQUENCY", "description": "สำหรับผู้ผ่านพื้นฐานและเริ่มเห็นความถนัดของตนเอง แยกเรียนตามเอกที่เลือก และพบเพื่อนที่มีความชอบคล้ายกัน พร้อมบางชั่วโมงที่เรียนร่วมกับเอกอื่น", "note": "สีเข็มกลัดประจำเอก: แดง / ฟ้า / ม่วง / ดำ"}, {"title": "ปี 3", "name": "กรุ๊ปฟอร์มทีม", "english": "A CONSTELLATION TOGETHER", "description": "สถาบันจับนักเรียนจากแต่ละเอกมารวมทีม เพื่อทำงานร่วมกันตลอดการศึกษา แต่ละทีมมีสมาชิกตั้งแต่ 4 คนขึ้นไป เรียนรู้การปรับตัว การแก้ปัญหาบนเวที และค้นหาตำแหน่งที่เหมาะสมในวง", "note": "เรียนรู้ที่จะเปล่งประกายไปด้วยกัน"}, {"title": "ปี 4", "name": "กรุ๊ปเตรียมเดบิวต์", "english": "READY FOR THE SPOTLIGHT", "description": "สำหรับผู้มีความพร้อมก่อนเดบิวต์ โดยมีค่ายและสื่อบันเทิงจากภายนอกเข้ามาติดตาม เรียนจำลองการทำงานจริง การรับมือสื่อและข่าวลือ การทำคอนเสิร์ต และแคสติ้งงานอย่างมืออาชีพ", "note": "มีการประเมินอย่างต่อเนื่อง และอาจถูกลดระดับชั้นตามความพร้อม"}], "majors": [{"name": "เอกการเต้น", "english": "Dance", "color": "#d96e88", "description": "ฝึกการเต้นร่วมสมัย จดจำไลน์เต้น และเคลื่อนไหวพร้อมกันเป็นทีม เรียนรู้บุคลิกภาพ การจัดระเบียบร่างกาย ความยืดหยุ่น การทรงตัว และการสลับตำแหน่งบนเวที", "detail": "เข็มกลัดสีแดง — การเคลื่อนไหวที่บอกเล่าตัวตน"}, {"name": "เอกขับร้อง", "english": "Vocal", "color": "#86cbeb", "description": "เรียนเทคนิคการใช้เสียง ควบคุมลมหายใจ ร้องประสานเสียง และฟังแยกคอร์ดหรือตัวโน้ต พร้อมทฤษฎีดนตรีสากลพื้นฐานและเครื่องดนตรีอย่างน้อย 1 ชิ้น", "detail": "เข็มกลัดสีฟ้า — ท่วงทำนองที่ส่งไปถึงดวงดาว"}, {"name": "เอกธุรกิจบันเทิง", "english": "Entertainment", "color": "#b69cde", "description": "สร้างบีท มิกซ์เสียง แต่งทำนอง บริหารศิลปิน สร้างภาพลักษณ์ และเรียนรู้การตลาด ลิขสิทธิ์และสัญญา สามารถดูแลเพลง การอัดเสียง การประสานงาน และทิศทางอัลบั้มของวง", "detail": "เข็มกลัดสีม่วง — ผู้อยู่เบื้องหลังทุกความเป็นไปได้"}, {"name": "เอกการแสดง", "english": "Acting", "color": "#b7a99a", "description": "ฝึกตีความบทบาท เข้าถึงอารมณ์ แสดงหน้ากล้องและบนเวที ต่อยอดสู่งานวาไรตี้ พิธีกร และบทบาทในมิวสิกวิดีโอ เพื่อพาผู้ชมเข้าถึงอารมณ์ของเพลง", "detail": "เข็มกลัดสีดำ — เรื่องราวที่มีชีวิตบนเวที"}], "classes": [{"title": "จิตวิทยาไอดอลและการรับมือสื่อ", "description": "ตอบคำถามนักข่าว จัดการความเครียด และรับมือคอมเมนต์ในวงการบันเทิง"}, {"title": "ทดลองฟอร์มวง — ปี 2", "description": "สุ่มรวมแต่ละเอกเป็นทีม 4–6 คน แลกเปลี่ยนทักษะ และเตรียมโชว์บนเวทีทดสอบ"}, {"title": "ประวัติศาสตร์และเทรนด์วงการบันเทิง", "description": "วิเคราะห์มิวสิกวิดีโอและกรณีศึกษาจากวงไอดอลที่ประสบความสำเร็จ"}, {"title": "จำลองการประเมินผล", "description": "ปี 2 ขึ้นไปรวมทีม 4–5 คนจำลองการเดบิวต์ ส่วนปี 1 แสดงเดี่ยวเพื่อประเมินพัฒนาการ"}], "invitation": {"title": "A ticket to\nyour next chapter.", "heading": "บัตรเชิญแห่งดวงดาว", "image": "/assets/ticket.webp", "passImage": "/assets/student-pass.webp", "paragraphs": ["บัตรเชิญจาก Astraea Idol Academy ภายนอกดูคล้ายตั๋วรถไฟธรรมดา แต่แท้จริงคือกุญแจที่เชื่อมต่อกับรถไฟแห่งดวงดาว เมื่อผู้ถือบัตรยอมรับคำเชิญและพร้อมเดินทาง รถไฟจะปรากฏ ณ สถานที่ที่สามารถรับตัวได้ แม้ไม่มีรางรถไฟอยู่เลยก็ตาม", "รถไฟพาผู้โดยสารข้ามโลก มิติ และจักรวาล มุ่งสู่สถาบัน โดยมีเพียงผู้ถือบัตรและผู้ได้รับอนุญาตที่มองเห็นและขึ้นรถไฟได้ เมื่อมาถึงโรงเรียน บัตรจะเปลี่ยนสถานะเป็น Star Student Pass เพื่อยืนยันตัวตนและใช้เดินทางกลับโลกของตนตามเวลาที่ได้รับอนุญาต"], "details": ["รถไฟมาถึงเมื่อผู้ถือบัตรพร้อม ไม่ใช่เวลาที่นาฬิกากำหนด", "ระหว่างทางจะเห็นกาแล็กซี เนบิวลา และโลกที่ไม่เคยพบ", "หากบัตรสูญหาย บัตรจะกลับมายังเจ้าของที่มันเลือกไว้", "การลาหยุดทำได้ไม่เกิน 4 ครั้งต่อปี โดยต้องได้รับอนุญาตก่อนเดินทาง ยกเว้นกรณีพิเศษที่สถาบันพิจารณา"]}, "students": {"title": "นักเรียนแห่ง Astraea", "description": "ผู้ได้รับบัตรเชิญจากหลากหลายช่วงวัย เผ่าพันธุ์ และจักรวาล มีสิทธิ์เข้าศึกษาอย่างเท่าเทียม ระดับชั้นกำหนดจากความสามารถและพัฒนาการ มากกว่าอายุหรือชาติกำเนิด", "uniformImage": "/assets/uniform.webp", "badgesImage": "/assets/badges.webp", "majorBadgesImage": "/assets/major-badges.webp"}, "council": {"title": "The Student Council", "description": "องค์กรดูแลความเรียบร้อย ประสานงานระหว่างนักเรียน อาจารย์ และฝ่ายบริหาร รวมถึงรับผิดชอบเทศกาล การแข่งขัน และการแสดงใหญ่ แบ่งเป็นฝ่ายชายและฝ่ายหญิงที่มีโครงสร้างและอำนาจหน้าที่เท่าเทียมกัน", "positions": ["ประธาน", "รองประธาน", "เลขานุการ", "เหรัญญิก"], "status": "ข้อมูลสมาชิกสภาจะอัปเดตในภายหลัง", "image": "/assets/council.webp", "teachers": "อาจารย์คือผู้เชี่ยวชาญจากหลากหลายโลกและเผ่าพันธุ์ ทั้งอดีตไอดอล นักแสดง นักแต่งเพลง นักเต้น โปรดิวเซอร์ และผู้บริหาร ทำหน้าที่สอน เป็นที่ปรึกษา ติดตามพัฒนาการ และประเมินความพร้อมก่อนเดบิวต์ ภายใต้การกำกับดูแลของผู้อำนวยการ"}, "rules": [{"title": "กฎภายในโรงเรียน", "text": "เคารพทุกเผ่าพันธุ์และทุกวัฒนธรรม \n* ห้ามเลือกปฏิบัติ ดูหมิ่น หรือสร้างความขัดแย้งจากเชื้อชาติ เผ่าพันธุ์ ภาษา ศาสนา หรือโลกกำเนิดของนักเรียน \n\nห้ามใช้พลังหรือเวทมนตร์ทำร้ายผู้อื่น \n* อนุญาตให้ใช้เฉพาะในการเรียน การฝึกซ้อม หรือการแข่งขันที่โรงเรียนรับรองเท่านั้น \n\nนักเรียนต้องพก Star Student Pass ติดตัวเสมอ \n* ใช้สำหรับยืนยันตัวตน เข้าอาคารต่าง ๆ และเรียกใช้รถไฟแห่งดวงดาวเมื่อได้รับอนุญาต \n\nห้ามออกนอกเขตโรงเรียนโดยไม่ได้รับอนุญาต \n* การเดินทางระหว่างโลกต้องได้รับการอนุมัติจากอาจารย์หรือผู้อำนวยการ และใช้บริการ Stellar Express เท่านั้น \n\nรักษาความลับของ Astraea Idol Academy  \n* ห้ามเปิดเผยตำแหน่งหรือวิธีการเข้าสู่โรงเรียนแก่บุคคลภายนอกที่ไม่ได้รับคำเชิญ \n\nเคารพการฝึกซ้อมและการแสดง \n* การขัดขวางการเรียน การซ้อม หรือการแสดงของผู้อื่น ถือเป็นความผิดทางวินัย\n\nดูแลอุปกรณ์ของโรงเรียน \n* หากทำลายทรัพย์สินโดยเจตนา จะต้องรับผิดชอบตามระเบียบของโรงเรียน \n\nการลาหยุด \n* นักเรียนสามารถลาหยุดเพื่อเข้าร่วมเทศกาลหรือวันสำคัญของโลกบ้านเกิดได้ ไม่เกิน 4 ครั้งต่อปีการศึกษา โดยต้องได้รับอนุญาตจากผู้อำนวยการหรืออาจารย์ผู้รับผิดชอบ  \n\nห้ามปลอมแปลงหรือโอนสิทธิ์บัตรนักเรียน \n* Star Student Pass เป็นของเจ้าของเพียงผู้เดียว ไม่สามารถยืม ซื้อขาย หรือโอนให้ผู้อื่นใช้ได้ \n\nประพฤติตนสมกับการเป็นนักเรียน Astraea \n* นักเรียนทุกคนเป็นตัวแทนของโรงเรียน การกระทำที่สร้างความเสียหายต่อชื่อเสียงของสถาบันทั้งภายในและภายนอกโรงเรียน อาจได้รับโทษทางวินัย \n\nระดับบทลงโทษ\n* ✦ ตักเตือน - ความผิดเล็กน้อย \n* ✦✦ หักคะแนนความประพฤติ - ทำผิดซ้ำหรือฝ่าฝืนกฎทั่วไป \n* ✦✦✦ พักการแสดง/พักการฝึก - ความผิดที่กระทบผู้อื่น \n* ✦✦✦✦ พักการเรียนชั่วคราว - ความผิดร้ายแรง \n* ✦✦✦✦✦ พิกถอนสิทธิ์นักเรียนและยึด Star Student Pass - ใช้ในกรณีร้ายแรง เช่น เปิดเผยความลับของโรงเรียน ทำร้ายผู้อื่นโดยเจตนา หรือก่ออันตรายต่อโรงเรียนและนักเรียน"}, {"title": "กฎการสร้างตัวละคร", "text": "หมายเหตุ : กรุณาอ่านกฏให้ครบถ้วนเพื่อป้องกันการถูกปรับแก้ในอนาคตและหากมีข้อสงสัยใดๆสามารถสอบถามได้ด้านใต้คอมเมนต์หรือแมสเสจเจอร์ส่วนตัวผู้โพสต์\n\nเกี่ยวส่วนสูงของตัวละคร\n* สามารถมีส่วนสูงได้สูงสุด 300 เซนติเมตร \n\n* กรณีที่เป็นเผ่าพันธุ์ที่มีส่วนสูงเกิน 300 เซนติเมตร ( เช่นยักษ์ที่สูง 5 เมตร )  จะต้องมีอีกร่างที่ส่วนสูงอยู่ในขอบเขตที่กำหนดไว้เท่านั้น และต้องใช้ร่างนั้นเวลาอยู่ที่โรงเรียนหรือทำการแสดง \n\n* กรณีที่เป็นตัวละครที่มีหางสามารถสูงสุดได้ที่ 350 เซนติเมตร โดยต้องนับรวมหางด้วยเท่านั้น \n( เช่นตัวละคร 300 เซนติเมตร หางอีก 50 เซนติเมตร รวม 350 เซนติเมตร )\n\nเกี่ยวกับรอยสักและการเจาะภายในร่างกาย\n\n* สามารถมีรอยสักได้เฉพาะบุคคลที่มีรอยสักอยู่เป็นทุนเดิมอยู่แล้ว หลังจากเข้าสถาบันจะไม่สามารถสักเพิ่มได้ ( เช่นก่อนเข้าสถาบันมีรอยสักที่คอ หรือ มีรอยสักประจำเผ่า อยู่แล้ว ก็ไม่เป็นไร )\n\n* สามารถเจาะได้เพียงที่หูได้เท่านั้น แต่หากเป็นการเจาะตามประเพณีในดาวหรือเผ่านั้นๆไม่จำเป็นต้องเอาออก\n\nเกี่ยวกับการดัดแปลงชุด\n\n* ไม่สามารถใส่ชุดสลับเพศได้เพื่อป้องกันการสับสนการแบ่งทีม แต่สามารถปรับเปลี่ยนให้เป็นชุดแนว UNISEX ได้\n\n* ดัดแปลงชุดได้สูงสุด 30% แต่ไม่สามารถปรับเปลี่ยนสีของเครื่องแบบได้ ( สีขาว / ดำ / ทอง ) \n\n* สามารถดัดแปลงดีไซน์ กระโปรงและกางเกง ได้ โดยที่ไม่ส่อไปทางเพศเด็ดขาด ( เช่นการโชว์หน้าอกวาบหวิวจนเกินไป หรือการเปิดเผยเนื้อหนังเกินสมควร )\n\nเกี่ยวกับโรคประจำตัวและเพศ\n\n* สามารถงอกตัวละครที่มีทั้งสองเพศได้ โดยจะทำการแบ่งตามกายภาพ ( เช่นตัวละครมีหน้าอกคล้ายเพศหญิงจะอยู่ฝั่งหญิง หรือ ตัวละครที่มีรูปร่างคล้ายชายจะอยู่ฝั่งชาย  ) \n\n* สามารถงอกตัวละครไร้เพศได้ โดยจะทำการแบ่งตามความต้องการของบุคคลนั้นๆ ( เช่น อยากอยู่ฝ่ายไอดอลหญิงก็จะอยู่ฝ่ายไอดอลหญิง หากอยากอยู่ฝ่ายไอดอลชายก็จะได้อยู่ฝ่ายไอดอลชาย ) แต่การตัดสินใจของบุคคลเหล่านั้นจะไม่สามารถเปลี่ยนแปลงได้ จำต้องอยู่ฝ่ายที่ตัวเองเลือกจนจบการศึกษา \n\n* สามารถมีโรคประจำตัวหรือการพิการได้ แต่สิ่งเหล่านั้นต้องไม่เป็นปัญหาในการทำโชว์ต่างๆเด็ดขาด ( เช่นการใช้พลังพิเศษของตนเองในการกลบข้อด้อย หรือ การต่อขึ้นมาใหม่ด้วยเทคโนโลยีต่างๆ ) รวมถึงการพิการทางเผ่าพันธุ์เช่นกัน ( เช่นเผ่าพันธุ์นี้หากมีหางจะถือว่าพิการ )\n\n* หากเป็นกรรมพันธุ์ทางสายพันธุ์จะไม่ถูกนับว่าเป็นการพิการ ( เช่นเผ่าพันธุ์ที่ไม่มีตา ไม่มีหู หรือ อื่นๆ ) \n\nเกี่ยวกับกายภาพอื่นๆและพลัง\n\n* สีผม ตา สีเล็บ และ ผิว สามารถทำได้อย่างอิสระไม่มีข้อจำกัดใดๆ\n\n* สามารถงอกสิ่งมีชีวิตรูปลักษณ์มนุษย์ได้ เช่น เอเลี่ยนสปีชีส์อื่นๆของตนเองหรือเผ่าอื่นๆ แต่จำเป็นต้องมีร่างที่สามารถทำกิจกรรมอื่นๆได้ ( เช่นการเป็นปลา แต่มีร่างมนุษย์อยู่ )\n\n* ตัวละครสามารถมีพลังได้อย่างอิสระ แต่สามารถใช้สำหรับการแสดงโชว์ได้เท่านั้น หากใช้พลังกับความรุนแรงจะถูกถอดออกจากการศึกษา"}, {"title": "กฎภายในแท็ก", "text": "หมายเหตุ : กรุณาอ่านกฏให้ครบถ้วนเพื่อป้องกันการเกิดปัญหาในอนาคตและการตัดสินของสต๊าฟและแม่แท็กถือว่าเป็นที่สุด หากทำการตักเตือนไปแล้วยังมีการกระทำผิดกฏต่อจะทำการเชิญออกจากดิสหรือพื้นที่สาธารณะของแท็ก\n\n* ตัวละครต้องเป็นตัวละครที่สร้างขึ้นเอง หรือ ตัวละครที่ซื้อมาในการครอบครองของตนเอง ( อดอป/คัสต้อม ) เท่านั้น \n* ไม่อนุญาตให้มีการนำภาพของผู้อื่น หรือจากเว็บ Picrew มาใช้ โดยห้ามใช้ Ai generated และ ห้ามทำการเทรซภาพ (อนุญาตให้ใช้เบสได้) แอบอ้างผลงานผู้อื่นที่ไม่ใช่ของตนโดยไม่ได้รับอนุญาตจากเจ้าของงาน หากเป็นการคอมมิชชั่น , มีผู้อื่นวาดให้ หรือใช้เบสสำหรับวาด ต้องแนบรูป / ให้เครดิตผู้วาดเอาไว้ให้ชัดเจน\n* การสร้าง Hashtag หรือจัดกิจกรรม , Events ใดๆ โปรดแจ้งผ่าน Official Account ของแท็ก เพื่อรับการอนุมัติก่อนลงหน้าไทม์ไลน์ แต่หากเป็นกิจกรรมเล็กๆอาทิเช่น วาดรูปสลับเพศ วาดเหตุสมมุติต่างๆ หรือ อื่นๆ สามารถจัดกันเองได้โดยไม่ต้องรอการอณุมัติใดๆ\n* ตัวละครที่พูดคำหยาบกรุณาใช้คำเซ็นเซอร์ เช่น เหี้* ขอให้ไม่หยาบคายจนกเกินไป สามารถสบถหรือจะด่าเป็นภาษาอื่นๆก็ย่อมได้\n* ไม่หยิบคำพูดเกี่ยวกับการเมือง เพื่อความปลอ
