niformImage":"/assets/uniform.webp","badgesImage":"/assets/badges.webp","majorBadgesImage":"/assets/major-badges.webp"},"council":{"title":"The Student Council","description":"องค์กรดูแลความเรียบร้อย ประสานงานระหว่างนักเรียน อาจารย์ และฝ่ายบริหาร รวมถึงรับผิดชอบเทศกาล การแข่งขัน และการแสดงใหญ่ แบ่งเป็นฝ่ายชายและฝ่ายหญิงที่มีโครงสร้างและอำนาจหน้าที่เท่าเทียมกัน","positions":["ประธาน","รองประธาน","เลขานุการ","เหรัญญิก"],"status":"รายชื่อสภานักเรียนฝั่งชายและฝั่งหญิง","image":"/assets/council.webp","teachers":"อาจารย์คือผู้เชี่ยวชาญจากหลากหลายโลกและเผ่าพันธุ์ ทั้งอดีตไอดอล นักแสดง นักแต่งเพลง นักเต้น โปรดิวเซอร์ และผู้บริหาร ทำหน้าที่สอน เป็นที่ปรึกษา ติดตามพัฒนาการ และประเมินความพร้อมก่อนเดบิวต์ ภายใต้การกำกับดูแลของผู้อำนวยการ","femaleMembers":[{"role":"ประธาน","name":"Sélynne Aurethiel","thai":"เซลินน์ ออเรธีเอล"},{"role":"รองประธาน","name":"Selen","thai":"เซเลนต์"},{"role":"เหรัญญิก","name":"Camellia","thai":"คาเมเลีย"},{"role":"เลขานุการ","name":"Ophielle Marisperle","thai":"โอฟีเอลล์ เนเครอเวลล์"}],"maleMembers":[{"role":"ประธาน","name":"Malakai Silvergrand","thai":"มาลาไค ซิลเวอร์แกรนด์"},{"role":"รองประธาน","name":"Kaelor Zarvian Voranis","thai":"เคเลอร์ ซาร์เวียน โวรานิส"},{"role":"เลขานุการ","name":"Konstantin Volkov","thai":"คอนสแตนติน โวลคอฟ"},{"role":"เหรัญญิก","name":"Oceon Raventhir","thai":"โอซีออน เรเวนเทียร์"}]},"rules":[{"title":"กฎภายในโรงเรียน","text":"เคารพทุกเผ่าพันธุ์และทุกวัฒนธรรม \n* ห้ามเลือกปฏิบัติ ดูหมิ่น หรือสร้างความขัดแย้งจากเชื้อชาติ เผ่าพันธุ์ ภาษา ศาสนา หรือโลกกำเนิดของนักเรียน \n\nห้ามใช้พลังหรือเวทมนตร์ทำร้ายผู้อื่น \n* อนุญาตให้ใช้เฉพาะในการเรียน การฝึกซ้อม หรือการแข่งขันที่โรงเรียนรับรองเท่านั้น \n\nนักเรียนต้องพก Star Student Pass ติดตัวเสมอ \n* ใช้สำหรับยืนยันตัวตน เข้าอาคารต่าง ๆ และเรียกใช้รถไฟแห่งดวงดาวเมื่อได้รับอนุญาต \n\nห้ามออกนอกเขตโรงเรียนโดยไม่ได้รับอนุญาต \n* การเดินทางระหว่างโลกต้องได้รับการอนุมัติจากอาจารย์หรือผู้อำนวยการ และใช้บริการ Stellar Express เท่านั้น \n\nรักษาความลับของ Astraea Idol Academy  \n* ห้ามเปิดเผยตำแหน่งหรือวิธีการเข้าสู่โรงเรียนแก่บุคคลภายนอกที่ไม่ได้รับคำเชิญ \n\nเคารพการฝึกซ้อมและการแสดง \n* การขัดขวางการเรียน การซ้อม หรือการแสดงของผู้อื่น ถือเป็นความผิดทางวินัย\n\nดูแลอุปกรณ์ของโรงเรียน \n* หากทำลายทรัพย์สินโดยเจตนา จะต้องรับผิดชอบตามระเบียบของโรงเรียน \n\nการลาหยุด \n* นักเรียนสามารถลาหยุดเพื่อเข้าร่วมเทศกาลหรือวันสำคัญของโลกบ้านเกิดได้ ไม่เกิน 4 ครั้งต่อปีการศึกษา โดยต้องได้รับอนุญาตจากผู้อำนวยการหรืออาจารย์ผู้รับผิดชอบ  \n\nห้ามปลอมแปลงหรือโอนสิทธิ์บัตรนักเรียน \n* Star Student Pass เป็นของเจ้าของเพียงผู้เดียว ไม่สามารถยืม ซื้อขาย หรือโอนให้ผู้อื่นใช้ได้ \n\nประพฤติตนสมกับการเป็นนักเรียน Astraea \n* นักเรียนทุกคนเป็นตัวแทนของโรงเรียน การกระทำที่สร้างความเสียหายต่อชื่อเสียงของสถาบันทั้งภายในและภายนอกโรงเรียน อาจได้รับโทษทางวินัย \n\nระดับบทลงโทษ\n* ✦ ตักเตือน - ความผิดเล็กน้อย \n* ✦✦ หักคะแนนความประพฤติ - ทำผิดซ้ำหรือฝ่าฝืนกฎทั่วไป \n* ✦✦✦ พักการแสดง/พักการฝึก - ความผิดที่กระทบผู้อื่น \n* ✦✦✦✦ พักการเรียนชั่วคราว - ความผิดร้ายแรง \n* ✦✦✦✦✦ พิกถอนสิทธิ์นักเรียนและยึด Star Student Pass - ใช้ในกรณีร้ายแรง เช่น เปิดเผยความลับของโรงเรียน ทำร้ายผู้อื่นโดยเจตนา หรือก่ออันตรายต่อโรงเรียนและนักเรียน"},{"title":"กฎการสร้างตัวละคร","text":"หมายเหตุ : กรุณาอ่านกฏให้ครบถ้วนเพื่อป้องกันการถูกปรับแก้ในอนาคตและหากมีข้อสงสัยใดๆสามารถสอบถามได้ด้านใต้คอมเมนต์หรือแมสเสจเจอร์ส่วนตัวผู้โพสต์\n\nเกี่ยวส่วนสูงของตัวละคร\n* สามารถมีส่วนสูงได้สูงสุด 300 เซนติเมตร \n\n* กรณีที่เป็นเผ่าพันธุ์ที่มีส่วนสูงเกิน 300 เซนติเมตร ( เช่นยักษ์ที่สูง 5 เมตร )  จะต้องมีอีกร่างที่ส่วนสูงอยู่ในขอบเขตที่กำหนดไว้เท่านั้น และต้องใช้ร่างนั้นเวลาอยู่ที่โรงเรียนหรือทำการแสดง \n\n* กรณีที่เป็นตัวละครที่มีหางสามารถสูงสุดได้ที่ 350 เซนติเมตร โดยต้องนับรวมหางด้วยเท่านั้น \n( เช่นตัวละคร 300 เซนติเมตร หางอีก 50 เซนติเมตร รวม 350 เซนติเมตร )\n\nเกี่ยวกับรอยสักและการเจาะภายในร่างกาย\n\n* สามารถมีรอยสักได้เฉพาะบุคคลที่มีรอยสักอยู่เป็นทุนเดิมอยู่แล้ว หลังจากเข้าสถาบันจะไม่สามารถสักเพิ่มได้ ( เช่นก่อนเข้าสถาบันมีรอยสักที่คอ หรือ มีรอยสักประจำเผ่า อยู่แล้ว ก็ไม่เป็นไร )\n\n* สามารถเจาะได้เพียงที่หูได้เท่านั้น แต่หากเป็นการเจาะตามประเพณีในดาวหรือเผ่านั้นๆไม่จำเป็นต้องเอาออก\n\nเกี่ยวกับการดัดแปลงชุด\n\n* ไม่สามารถใส่ชุดสลับเพศได้เพื่อป้องกันการสับสนการแบ่งทีม แต่สามารถปรับเปลี่ยนให้เป็นชุดแนว UNISEX ได้\n\n* ดัดแปลงชุดได้สูงสุด 30% แต่ไม่สามารถปรับเปลี่ยนสีของเครื่องแบบได้ ( สีขาว / ดำ / ทอง ) \n\n* สามารถดัดแปลงดีไซน์ กระโปรงและกางเกง ได้ โดยที่ไม่ส่อไปทางเพศเด็ดขาด ( เช่นการโชว์หน้าอกวาบหวิวจนเกินไป หรือการเปิดเผยเนื้อหนังเกินสมควร )\n\nเกี่ยวกับโรคประจำตัวและเพศ\n\n* สามารถงอกตัวละครที่มีทั้งสองเพศได้ โดยจะทำการแบ่งตามกายภาพ ( เช่นตัวละครมีหน้าอกคล้ายเพศหญิงจะอยู่ฝั่งหญิง หรือ ตัวละครที่มีรูปร่างคล้ายชายจะอยู่ฝั่งชาย  ) \n\n* สามารถงอกตัวละครไร้เพศได้ โดยจะทำการแบ่งตามความต้องการของบุคคลนั้นๆ ( เช่น อยากอยู่ฝ่ายไอดอลหญิงก็จะอยู่ฝ่ายไอดอลหญิง หากอยากอยู่ฝ่ายไอดอลชายก็จะได้อยู่ฝ่ายไอดอลชาย ) แต่การตัดสินใจของบุคคลเหล่านั้นจะไม่สามารถเปลี่ยนแปลงได้ จำต้องอยู่ฝ่ายที่ตัวเองเลือกจนจบการศึกษา \n\n* สามารถมีโรคประจำตัวหรือการพิการได้ แต่สิ่งเหล่านั้นต้องไม่เป็นปัญหาในการทำโชว์ต่างๆเด็ดขาด ( เช่นการใช้พลังพิเศษของตนเองในการกลบข้อด้อย หรือ การต่อขึ้นมาใหม่ด้วยเทคโนโลยีต่างๆ ) รวมถึงการพิการทางเผ่าพันธุ์เช่นกัน ( เช่นเผ่าพันธุ์นี้หากมีหางจะถือว่าพิการ )\n\n* หากเป็นกรรมพันธุ์ทางสายพันธุ์จะไม่ถูกนับว่าเป็นการพิการ ( เช่นเผ่าพันธุ์ที่ไม่มีตา ไม่มีหู หรือ อื่นๆ ) \n\nเกี่ยวกับกายภาพอื่นๆและพลัง\n\n* สีผม ตา สีเล็บ และ ผิว สามารถทำได้อย่างอิสระไม่มีข้อจำกัดใดๆ\n\n* สามารถงอกสิ่งมีชีวิตรูปลักษณ์มนุษย์ได้ เช่น เอเลี่ยนสปีชีส์อื่นๆของตนเองหรือเผ่าอื่นๆ แต่จำเป็นต้องมีร่างที่สามารถทำกิจกรรมอื่นๆได้ ( เช่นการเป็นปลา แต่มีร่างมนุษย์อยู่ )\n\n* ตัวละครสามารถมีพลังได้อย่างอิสระ แต่สามารถใช้สำหรับการแสดงโชว์ได้เท่านั้น หากใช้พลังกับความรุนแรงจะถูกถอดออกจากการศึกษา"},{"title":"กฎภายในแท็ก","text":"หมายเหตุ : กรุณาอ่านกฏให้ครบถ้วนเพื่อป้องกันการเกิดปัญหาในอนาคตและการตัดสินของสต๊าฟและแม่แท็กถือว่าเป็นที่สุด หากทำการตักเตือนไปแล้วยังมีการกระทำผิดกฏต่อจะทำการเชิญออกจากดิสหรือพื้นที่สาธารณะของแท็ก\n\n* ตัวละครต้องเป็นตัวละครที่สร้างขึ้นเอง หรือ ตัวละครที่ซื้อมาในการครอบครองของตนเอง ( อดอป/คัสต้อม ) เท่านั้น \n* ไม่อนุญาตให้มีการนำภาพของผู้อื่น หรือจากเว็บ Picrew มาใช้ โดยห้ามใช้ Ai generated และ ห้ามทำการเทรซภาพ (อนุญาตให้ใช้เบสได้) แอบอ้างผลงานผู้อื่นที่ไม่ใช่ของตนโดยไม่ได้รับอนุญาตจากเจ้าของงาน หากเป็นการคอมมิชชั่น , มีผู้อื่นวาดให้ หรือใช้เบสสำหรับวาด ต้องแนบรูป / ให้เครดิตผู้วาดเอาไว้ให้ชัดเจน\n* การสร้าง Hashtag หรือจัดกิจกรรม , Events ใดๆ โปรดแจ้งผ่าน Official Account ของแท็ก เพื่อรับการอนุมัติก่อนลงหน้าไทม์ไลน์ แต่หากเป็นกิจกรรมเล็กๆอาทิเช่น วาดรูปสลับเพศ วาดเหตุสมมุติต่างๆ หรือ อื่นๆ สามารถจัดกันเองได้โดยไม่ต้องรอการอณุมัติใดๆ\n* ตัวละครที่พูดคำหยาบกรุณาใช้คำเซ็นเซอร์ เช่น เหี้* ขอให้ไม่หยาบคายจนกเกินไป สามารถสบถหรือจะด่าเป็นภาษาอื่นๆก็ย่อมได้\n* ไม่หยิบคำพูดเกี่ยวกับการเมือง เพื่อความปลอดภัยของตนเอง\n* หากมีการทะเลาะกันระหว่างผู้ปกครอง รบกวนพูดคุยและเครียร์กันหลังไมค์ให้เรียบร้อย ไม่มีการพิมพ์แซะหรือด่าทอกันลงในที่สาธารณะ\n* หากต้องการลงงานเรท เนื้อหาที่สื่อไปทางเพศ หรือ NSFW รบกวนไม่ติดแท็กและลงภายในพื้นที่ส่วนตัวของตนเองเท่านั้น รวมถึงห้ามลงในดิสคอร์มสาธารณะ แต่สามารถลงรูปในห้องที่ทางเราจัดไว้ได้เพียงแค่นั้น\n* สามารถนำเซ็ตติ้งของแท็กหรือตัวละครภายในนี้ทำงานเชิงพาณิชย์ได้ อาทิเช่นการนำไปแต่งนิยาย หรือ โดจินชิ ยกเว้นการนำเสื้อผ้าของตัวแท็กไปขายเป็นอดอปรบกวนดัดแปลงก่อนนำไปขาย\n* การทะเลาะวิวาท หรือ การคุกคาม ตัวละครขอให้อยู่ในขอบเขตที่ตกลงกันแล้วหลังไมค์ระหว่างผู้ปกครองเพียงเท่านั้น ไม่อนุญาตให้กระทำสิ่งเหล่านั้นโดยไม่สอบถามความยินยอมอีกฝ่ายก่อน\n* แท็กไม่มีระยะเวลาเล่นและสิ้นสุด สามารถเริ่มเล่นได้ทุกครั้งที่ต้องการและสามารถสิ้นสุดได้ตามที่ต้องการ\n* ไม่อนุญาตให้มีตัวละครเสียชีวิตภายในเนื้อเรื่องหลักของแท็กแต่สามารถเสียชีวิตได้หลังจากจบการศึกษาได้\n* ตัวแท็กอาจไม่ได้มีการสร้าง Hashtag หรือจัดกิจกรรม , Events อะไรเนื่องจากเวลาในการจัดทำที่ค่อนข้างจำกัดขึ้น"}],"downloads":[{"title":"ชุดนักเรียน","description":"แบบเครื่องแต่งกายสำหรับสร้างตัวละคร","image":"/assets/uniform.webp","url":"https://drive.google.com/drive/folders/1N2XnpBknCiJIbTlclTj-WXXTi9Ar9G6j?usp=sharing"},{"title":"Star Student Pass","description":"ไฟล์บัตรประจำตัวนักเรียน","image":"/asse
